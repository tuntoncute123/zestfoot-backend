services:
  postgres:
    image: postgres:15-alpine
    container_name: zestfoot-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: zestfoot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  questdb:
    image: questdb/questdb:latest
    container_name: zestfoot-questdb
    ports:
      - "9000:9000"
      - "9009:9009"
    volumes:
      - questdb_data:/var/lib/questdb/db
    restart: always

  redis:
    image: redis:7-alpine
    container_name: zestfoot-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

volumes:
  postgres_data:
  questdb_data:
  redis_data:
